apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z db 3306; do echo waiting for db; sleep 3; done"]
      containers:
        - name: php-fpm
          image: laravel-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 9000
          envFrom:
            - secretRef:
                name: laravel-env
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app: app
  ports:
    - port: 9000
      targetPort: 9000
